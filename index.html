<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guardian Angel • 2025</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Inter:wght@300;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { orbitron: ['Orbitron', 'sans-serif'] } } } }
  </script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full bg-gradient-to-br from-[#0a001a] via-[#1a0033] to-[#000] text-cyan-300 overflow-hidden" x-data="app()" x-init="init()">

  <div class="fixed inset-0 bg-black/50 backdrop-blur-3xl"></div>
  <div class="fixed inset-0 bg-gradient-to-t from-purple-900/20 via-transparent to-cyan-900/20"></div>

  <div class="relative z-10 min-h-screen flex flex-col items-center justify-center p-6">

    <div class="text-center mb-16">
      <h1 class="font-orbitron text-7xl md:text-9xl font-black tracking-widest bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 bg-clip-text text-transparent drop-shadow-2xl">
        GUARDIAN ANGEL
      </h1>
      <p class="text-xl mt-6 opacity-80 tracking-widest" x-text="gpsStatus"></p>
      <p class="text-lg mt-2 opacity-70" x-text="batteryLevel + '% ' + (isCharging ? 'Charging' : '')"></p>
    </div>

    <!-- Sound Toggle + Settings -->
    <div class="fixed top-8 right-8 flex gap-4 z-50">
      <button @click="soundOn = !soundOn" class="w-14 h-14 rounded-full bg-black/60 border-2 flex items-center justify-center transition-all backdrop-blur-xl"
              :class="soundOn ? 'border-cyan-400 shadow-[0_0_30px_rgba(34,224,255,0.8)]' : 'border-red-600 shadow-[0_0_30px_rgba(255,79,112,0.8)]'">
        <i data-lucide="volume-2" x-show="soundOn" class="w-8 h-8 text-cyan-300"></i>
        <i data-lucide="volume-x" x-show="!soundOn" class="w-8 h-8 text-red-400"></i>
      </button>

      <button @click="contactsOpen = true" class="px-6 py-3 rounded-full bg-black/60 border-2 border-cyan-400 hover:bg-cyan-400/20 transition-all backdrop-blur-xl shadow-lg font-medium">
        Manage Contacts
      </button>
    </div>
          <!-- Visual indicator when Angel is listening -->
      <div x-show="$store.app?.angelListening" class="fixed top-4 left-4 z-50">
        <div class="bg-purple-600/80 backdrop-blur-xl px-6 py-3 rounded-full border-2 border-purple-400 shadow-2xl animate-pulse">
          <span class="font-bold text-white">Angel Listening...</span>
        </div>
      </div>

    <!-- PANIC ORB -->
    <button @touchstart.prevent="startHold" @mousedown.prevent="startHold"
            @touchend.prevent="endHold" @mouseup="endHold" @mouseleave="endHold"
            class="relative w-96 h-96 group">
      <div class="absolute inset-0 rounded-full bg-gradient-to-br from-red-600/30 to-pink-700/30 blur-3xl group-active:blur-xl transition-all duration-500"></div>
      <div class="relative w-full h-full rounded-full bg-black/60 backdrop-blur-2xl border-4 border-red-500/60 shadow-2xl shadow-red-600/50 flex items-center justify-center overflow-hidden">
        <svg class="absolute inset-0 w-full h-full -rotate-90">
          <circle cx="50%" cy="50%" r="175" stroke="rgba(255,255,255,0.1)" stroke-width="12" fill="none"/>
          <circle cx="50%" cy="50%" r="175" stroke="#06f9d4" stroke-width="12" fill="none"
                  stroke-dasharray="1100" :stroke-dashoffset="progress" class="transition-all duration-75"/>
        </svg>
        <div class="text-center z-10 font-orbitron text-4xl md:text-5xl font-bold tracking-widest" :class="holding ? 'text-red-400' : 'text-cyan-300'">
          <span x-show="!sent">HOLD TO<br>ACTIVATE</span>
          <span x-show="sent" class="text-green-400 animate-pulse text-6xl">SENT</span>
        </div>
      </div>
    </button>

    <p class="mt-12 text-2xl font-light tracking-widest" x-text="status"></p>

    <!-- SPEED DIALS WITH PHOTOS + LABELS + 911 -->
    <div class="absolute inset-x-0 bottom-8 flex flex-col items-center gap-6 z-40 px-8">
      <div class="flex gap-10">
        <!-- 911 Button -->
        <div class="flex flex-col items-center">
          <button @click="call911()" class="relative w-28 h-28 rounded-full bg-red-600/90 border-6 border-red-400 shadow-2xl shadow-red-600/80 hover:scale-110 transition-all duration-300 flex items-center justify-center backdrop-blur-xl">
            <div class="font-orbitron text-5xl font-black text-white drop-shadow-2xl">911</div>
            <div class="absolute inset-0 rounded-full bg-red-500/60 blur-xl animate-pulse"></div>
          </button>
          <p class="mt-3 text-sm font-bold text-red-400 tracking-wider">EMERGENCY</p>
        </div>

        <!-- Guardians with Photos -->
        <template x-for="c in contacts" :key="c.id">
          <div class="flex flex-col items-center">
            <button @click="speedDial(c)" 
                    class="w-24 h-24 rounded-full overflow-hidden border-4 border-cyan-400/80 hover:border-cyan-300 hover:scale-110 transition-all duration-300 shadow-2xl backdrop-blur-xl ring-4 ring-cyan-500/30 hover:ring-cyan-400/60">
              <img :src="c.photo || 'https://via.placeholder.com/96/1a0033/06f9d4?text=' + c.name.charAt(0)" 
                   alt="photo" class="w-full h-full object-cover">
            </button>
            <p class="mt-3 text-sm font-bold text-cyan-300 truncate w-24 text-center" x-text="c.name"></p>
          </div>
        </template>
      </div>
    </div>

    <!-- Toast -->
    <div x-show="toast" x-transition class="fixed top-32 left-1/2 -translate-x-1/2 bg-black/80 text-cyan-300 px-10 py-5 rounded-full border border-cyan-500 shadow-2xl text-2xl font-bold backdrop-blur-xl z-50">
      <span x-text="toast"></span>
    </div>

    <!-- Contacts Modal — PHOTO UPLOAD FIXED -->
    <div x-show="contactsOpen" class="fixed inset-0 bg-black/90 backdrop-blur-2xl flex items-center justify-center z-50" @click="contactsOpen=false">
      <div class="bg-gradient-to-b from-purple-900/60 to-black/80 p-10 rounded-3xl border-4 border-cyan-500 shadow-2xl max-w-2xl w-full mx-8" @click.stop>
        <h2 class="font-orbitron text-5xl text-cyan-300 mb-8 text-center">GUARDIANS</h2>

        <button @click="importContact()" class="w-full py-4 bg-green-600/80 hover:bg-green-500 text-2xl font-bold rounded-2xl mb-6 shadow-2xl backdrop-blur-xl">
          Import from Phone Contacts
        </button>

        <div class="space-y-4 max-h-96 overflow-y-auto">
          <template x-for="c in contacts" :key="c.id">
            <div class="bg-black/50 p-6 rounded-2xl border border-cyan-500/50 flex items-center gap-6">
              <img :src="c.photo || 'https://via.placeholder.com/80/1a0033/06f9d4?text=' + c.name.charAt(0)" 
                   class="w-20 h-20 rounded-full object-cover border-2 border-cyan-400">
              <div class="flex-1">
                <div class="text-2xl font-bold" x-text="c.name"></div>
                <div class="text-lg opacity-80" x-text="c.phone"></div>
              </div>
              <button @click="remove(c.id)" class="text-red-400 text-4xl hover:scale-125 transition">×</button>
            </div>
          </template>
        </div>

        <div class="mt-8">
          <input x-model="newName" placeholder="Name" class="w-full p-4 bg-black/60 border border-cyan-500 rounded-2xl text-white text-xl mb-4">
          <input x-model="newPhone" placeholder="Phone (+1...)" class="w-full p-4 bg-black/60 border border-cyan-500 rounded-2xl text-white text-xl mb-4">
          <textarea x-model="newMsg" placeholder="Custom message..." class="w-full p-4 bg-black/60 border border-cyan-500 rounded-2xl text-white text-xl h-32 mb-4"></textarea>
          
          <!-- PHOTO UPLOAD — FIXED -->
          <div class="relative">
            <input type="file" accept="image/*" @change="handlePhoto($event)" id="photoInput" class="hidden">
            <button @click="document.getElementById('photoInput').click()" 
                    class="w-full py-4 bg-purple-600/80 hover:bg-purple-500 text-xl font-bold rounded-2xl mb-4 transition-all">
              Upload Photo
            </button>
          </div>

          <div x-show="photoPreview" class="w-full h-32 rounded-2xl overflow-hidden mb-4 border-2 border-cyan-400">
            <img :src="photoPreview" class="w-full h-full object-cover">
          </div>

          <button @click="addGuardian()" class="w-full py-6 bg-cyan-600 hover:bg-cyan-500 text-2xl font-bold rounded-2xl transition-all">
            ADD GUARDIAN
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- Angel Voice Indicator -->
  <div id="angel-indicator" 
      class="fixed top-8 left-8 z-50 opacity-0 transition-opacity duration-500 pointer-events-none">
    <div class="bg-purple-600/90 backdrop-blur-xl px-8 py-4 rounded-full border-4 border-purple-400 shadow-2xl flex items-center gap-3">
      <div class="w-4 h-4 bg-red-500 rounded-full animate-ping"></div>
      <span class="font-bold text-white text-xl">ANGEL LISTENING...</span>
    </div>
  </div>

  <!-- ASSESSMENT MODAL — Appears after 2-second hold OR voice "panic" -->
<div x-show="assessing" 
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0 scale-95"
     x-transition:enter-end="opacity-100 scale-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-end="opacity-0 scale-95"
     class="fixed inset-0 z-50 flex items-center justify-center px-4"
     style="display: none;">

  <!-- Backdrop -->
  <div @click="assessing = false" class="absolute inset-0 bg-black/80 backdrop-blur-sm"></div>

  <!-- Modal Card -->
  <div class="relative max-w-md w-full bg-gray-900 rounded-3xl shadow-2xl border border-red-500/50 overflow-hidden animate-pulse-slow">
    
    <!-- Emergency Header -->
    <div class="bg-gradient-to-r from-red-600 to-red-800 px-8 py-6 text-center">
      <h2 class="text-3xl font-black text-white tracking-wider">EMERGENCY ASSESSMENT</h2>
      <p class="text-red-200 mt-2 text-sm">Answer quickly — help is ready</p>
    </div>

    <!-- Question -->
    <div class="px-8 py-10 text-center">
      <p x-text="question" class="text-2xl font-bold text-white leading-tight mb-8"></p>

      <!-- Yes / No Buttons -->
      <div class="grid grid-cols-2 gap-6">
        <button @click="answer('yes')"
                class="bg-green-600 hover:bg-green-500 active:scale-95 transform transition-all duration-150 text-white font-black text-2xl py-6 rounded-2xl shadow-lg">
          YES
        </button>
        <button @click="answer('no')"
                class="bg-red-600 hover:bg-red-500 active:scale-95 transform transition-all duration-150 text-white font-black text-2xl py-6 rounded-2xl shadow-lg">
          NO
        </button>
      </div>

      <!-- Can't Answer / Panic Button -->
      <div class="mt-10">
        <button @click="cantAnswer()"
                class="w-full bg-black/70 hover:bg-black border-4 border-red-500 text-red-400 font-black text-xl py-5 rounded-2xl uppercase tracking-widest shadow-2xl animate-pulse">
          I CAN'T ANSWER — SEND HELP NOW
        </button>
      </div>

      <!-- Cancel (only if not in real danger) -->
      <div class="mt-6">
        <button @click="assessing = false; sent = false; status = 'Ready'; progress = 1100;"
                class="text-gray-400 hover:text-white text-sm underline">
          Cancel (false alarm)
        </button>
      </div>
    </div>

    <!-- Battery + GPS status at bottom -->
    <div class="bg-black/50 px-6 py-3 text-center text-gray-300 text-sm">
      <span x-text="gpsStatus"></span> 
      <span class="mx-3">•</span> 
      <span x-text="batteryLevel + '%'"></span>
      <span x-show="isCharging" class="text-green-400"> (charging)</span>
    </div>
  </div>
</div>

  <script src="script.js"></script>
  <script src="voiceActive.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
  <script>document.addEventListener('DOMContentLoaded', () => lucide.createIcons());</script>
</body>
</html>
